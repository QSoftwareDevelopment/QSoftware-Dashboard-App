<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>No connection</title>
  <style>
    :root {
      --brand: #4f46e5; --canvas: #f1f3f9; --surface: #fff;
      --ink: #0f1222; --muted: #5b6076; --line: #e2e5ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #6366f1; --canvas: #08090f; --surface: #14161f;
        --ink: #f4f5fb; --muted: #9aa0b4; --line: #262a38;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: var(--canvas); color: var(--ink);
      font: 400 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      -webkit-user-select: none; user-select: none;
    }
    .card {
      width: 100%; max-width: 360px; text-align: center;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 20px; padding: 32px 26px;
    }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 16px; background: color-mix(in srgb, var(--brand) 12%, transparent);
    }
    svg { width: 28px; height: 28px; stroke: var(--brand); fill: none; stroke-width: 2; stroke-linecap: round; }
    h1 { margin: 0 0 8px; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
    p { margin: 0 0 22px; font-size: 14.5px; color: var(--muted); }
    button {
      width: 100%; padding: 13px 20px; border: 0; border-radius: 12px;
      background: var(--brand); color: #fff;
      font: 600 15px/1 inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: .88; }
    button[disabled] { opacity: .6; }
    .status { margin: 14px 0 0; font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M1 1l22 22" />
        <path d="M16.7 12.7a6 6 0 00-8.4 0" />
        <path d="M5 9.5a11 11 0 013.5-2.3M19 9.5a11 11 0 00-4.6-2.6" />
        <path d="M12 20h.01" />
      </svg>
    </div>
    <h1>No connection</h1>
    <p>Your dashboard needs the internet. We'll reconnect as soon as you're back online.</p>
    <button id="retry" type="button">Try again</button>
    <p class="status" id="status" role="status"></p>
  </div>

  <script>
    // Loaded from the app bundle by native code when the remote origin cannot be
    // reached — at that point no dashboard JS exists, so this page is standalone.
    (function () {
      var APP_URL = 'https://app.qsoftware.ca';
      var button = document.getElementById('retry');
      var status = document.getElementById('status');
      var attempts = 0;

      function retry(automatic) {
        button.disabled = true;
        status.textContent = automatic ? 'Reconnecting…' : 'Checking…';

        // A HEAD against the real origin, cache-busted: navigator.onLine reports
        // the radio, not whether anything is actually reachable.
        fetch(APP_URL + '/login?_probe=' + Date.now(), { method: 'HEAD', cache: 'no-store', mode: 'no-cors' })
          .then(function () { window.location.replace(APP_URL); })
          .catch(function () {
            attempts++;
            button.disabled = false;
            status.textContent = 'Still offline. Retrying automatically…';
            // Back off to 30s so a long outage does not drain the battery.
            setTimeout(function () { retry(true); }, Math.min(30000, 3000 * attempts));
          });
      }

      button.addEventListener('click', function () { retry(false); });
      window.addEventListener('online', function () { retry(true); });
      setTimeout(function () { retry(true); }, 3000);
    })();
  </script>
</body>
</html>
