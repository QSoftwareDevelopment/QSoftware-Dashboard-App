<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Q Software</title>
  <style>
    :root { --brand: #4f46e5; --violet: #7c3aed; --canvas: #f1f3f9; --ink: #0f1222; }
    @media (prefers-color-scheme: dark) { :root { --canvas: #08090f; --ink: #f4f5fb; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: linear-gradient(160deg, var(--brand), var(--violet));
      color: #fff;
      font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .wrap { text-align: center; padding: 24px; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 20px;
      border-radius: 22px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.24);
      display: grid; place-items: center;
      font: 700 38px/1 -apple-system, system-ui, sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    p { margin: 0; font-size: 14px; opacity: .72; }
    .spinner {
      margin: 22px auto 0; width: 22px; height: 22px;
      border: 2px solid rgba(255,255,255,.28);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <!--
    Rarely seen. capacitor.config.ts points server.url at the live dashboard, so
    the WebView goes straight there. This file exists because Capacitor requires
    an index.html in webDir, and it doubles as the frame the user sees if the
    remote load is slow enough to paint.
  -->
  <div class="wrap">
    <div class="mark">Q</div>
    <h1>Q Software</h1>
    <p>Connecting to your dashboard…</p>
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>
</body>
</html>
